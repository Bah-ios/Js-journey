<!DOCTYPE html>
<html>
    <head>
        <title>Interest Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="maindiv">

            <h1>Simple Interest Calculator</h1>
            <label for = "principal">Amount</label>
            <input type="number"  id="principal">  <br/>
    
            <label for = "rate">Rate</label> 
            <input type="range"  id="rate" min = 1 max = 20 step="0.25" onchange="updateRate()">  
            <span id = rate_val >
                
            </span>%
            <br/>
            <label for = "years">No. of Years</label> 
            <input type="number"  id="years"><br/>
            
            <label for = "result">Interest :</label>
             <span id="result"> </span><br>
    
            <button onclick="compute()">Compute Interest</button>
        </body>
        </div>
        <footer>
            &#169; This Calculator belongs to -- Bah-ios -- 
        </footer>
</html>
